<div class="login-container" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Iniciar Sesión</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px;">
      <label for="email" style="display: block; margin-bottom: 5px;">Correo Electrónico:</label>
      <input id="email" type="email" formControlName="email" style="width: 90%; padding: 8px;" />
    </div>
    
    <div style="margin-bottom: 15px;">
      <label for="password" style="display: block; margin-bottom: 5px;">Contraseña:</label>
      <input id="password" type="password" formControlName="password" style="width: 90%; padding: 8px;" />
    </div>

    <div *ngIf="errorMessage" style="color: red; margin-bottom: 15px;">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loginForm.invalid" style="width: 95%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px;">Ingresar</button>
  </form>
</div>
